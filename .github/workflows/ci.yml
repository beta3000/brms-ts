name: CI

# Runs quality checks on every pull request and push to main, and publishes
# with semantic-release only on pushes to main (after quality passes).
# Requires the repository secret NPM_TOKEN (an npm automation token) to publish.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Gate: only actors with write/admin permission may trigger PR runs. This
  # keeps external fork PRs from consuming CI until a maintainer intervenes.
  # Pushes to main (merges you control) always pass this gate.
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    steps:
      - name: Check actor permission
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          permission="$(gh api "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null || echo none)"
          echo "Actor '${ACTOR}' has permission: ${permission}"
          if [ "${permission}" != "write" ] && [ "${permission}" != "admin" ]; then
            echo "::error::Actor '${ACTOR}' lacks write access; refusing to run CI for this pull request."
            exit 1
          fi

  quality:
    name: Quality
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Pin npm to match the lockfile
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify package
        run: npm run build && npm run check:pkg

  release:
    name: Release
    needs: [authorize, quality]
    # Only publish on pushes to main, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags/commits and the GitHub release
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # enable npm publish --provenance via OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # semantic-release needs full history and tags
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Pin npm to match the lockfile
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true' # publish with provenance (public repo)
          HUSKY: '0' # disable git hooks for the automated release commit
        run: npx semantic-release
